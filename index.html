<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Risk Simulator</title>
  <meta name="theme-color" content="#07090F">
  <link rel="preload" href="fonts/sora.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/martian-mono.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ── Header ── -->
<header class="app-header">
  <div class="logo">AI Risk <span>Simulator</span></div>

  <div class="header-controls">
    <div class="control-group">
      <label for="scenario-select">Scenario</label>
      <select id="scenario-select" class="styled-select"></select>
    </div>

    <div class="control-group">
      <label for="horizon-select">Horizon</label>
      <select id="horizon-select" class="styled-select">
        <option value="30">30d</option>
        <option value="60" selected>60d</option>
        <option value="90">90d</option>
        <option value="180">180d</option>
      </select>
    </div>

    <div class="control-group">
      <label for="mc-runs-input">MC Runs</label>
      <input type="number" id="mc-runs-input" min="100" max="2000" step="100" value="300">
    </div>

    <button class="btn btn-primary" id="mc-btn">Run MC</button>

    <div class="mc-progress-wrap" id="mc-progress" style="display:none">
      <div class="mc-progress-outer">
        <div class="mc-progress-fill" id="mc-progress-bar" style="width:0%"></div>
      </div>
      <span class="mc-status-text" id="mc-status">—</span>
    </div>

    <div class="header-tools">
      <button class="btn btn-ghost" id="tour-btn" title="Step-by-step guide to the simulator"><svg class="ic" viewBox="0 0 256 256" aria-hidden="true"><path d="M140,180a12,12,0,1,1-12-12A12,12,0,0,1,140,180ZM128,72c-22.06,0-40,16.15-40,36v4a8,8,0,0,0,16,0v-4c0-11,10.77-20,24-20s24,9,24,20-10.77,20-24,20a8,8,0,0,0-8,8v8a8,8,0,0,0,16,0v-.72c18.24-3.35,32-17.9,32-35.28C168,88.15,150.06,72,128,72Zm104,56A104,104,0,1,1,128,24,104.11,104.11,0,0,1,232,128Zm-16,0a88,88,0,1,0-88,88A88.1,88.1,0,0,0,216,128Z"/></svg>Tour</button>
      <button class="btn btn-ghost" id="export-btn"><svg class="ic" viewBox="0 0 256 256" aria-hidden="true"><path d="M216,112v96a16,16,0,0,1-16,16H56a16,16,0,0,1-16-16V112A16,16,0,0,1,56,96H80a8,8,0,0,1,0,16H56v96H200V112H176a8,8,0,0,1,0-16h24A16,16,0,0,1,216,112ZM93.66,69.66,120,43.31V136a8,8,0,0,0,16,0V43.31l26.34,26.35a8,8,0,0,0,11.32-11.32l-40-40a8,8,0,0,0-11.32,0l-40,40A8,8,0,0,0,93.66,69.66Z"/></svg>Export</button>
      <button class="btn btn-ghost" id="import-btn"><svg class="ic" viewBox="0 0 256 256" aria-hidden="true"><path d="M224,144v64a8,8,0,0,1-8,8H40a8,8,0,0,1-8-8V144a8,8,0,0,1,16,0v56H208V144a8,8,0,0,1,16,0Zm-101.66,5.66a8,8,0,0,0,11.32,0l40-40a8,8,0,0,0-11.32-11.32L136,124.69V32a8,8,0,0,0-16,0v92.69L93.66,98.34a8,8,0,0,0-11.32,11.32Z"/></svg>Import</button>
      <input type="file" id="import-file" accept=".json" style="display:none">
    </div>
  </div>
</header>

<!-- ── Summary Chips ── -->
<div class="summary-chips">
  <div class="orb" id="risk-orb" data-band="low" aria-hidden="true"><span class="orb-body"></span><span class="orb-value" id="orb-value"></span></div>
  <div class="chip" id="chip-risk">
    <span class="chip-label">Risk Score</span>
    <span class="chip-value">—</span>
  </div>
  <div class="chip" id="chip-tail">
    <span class="chip-label">P(SEV)</span>
    <span class="chip-value">—</span>
  </div>
  <div class="chip" id="chip-net">
    <span class="chip-label">Net/day</span>
    <span class="chip-value">—</span>
  </div>
  <div class="chip" id="chip-pred">
    <span class="chip-label">P(red) max</span>
    <span class="chip-value">—</span>
  </div>
</div>

<!-- ── Main Layout ── -->
<div class="app-body">

  <!-- Sidebar: Decisions -->
  <aside class="sidebar">
    <div class="sidebar-section" style="flex:1.2; border-bottom:1px solid var(--c-border)">
      <div class="sidebar-title">Decision Library</div>
      <div id="decision-library"></div>
    </div>

    <div class="sidebar-section" style="flex:1">
      <div class="sidebar-title bundle-title">
        <span>Bundle</span>
        <span class="slot-switch" role="group" aria-label="Which bundle the sidebar edits">
          <button class="slot-btn slot-a" data-slot="A" aria-pressed="true">A</button>
          <button class="slot-btn slot-b" data-slot="B" aria-pressed="false">B</button>
        </span>
      </div>
      <div id="active-bundle"></div>
    </div>
  </aside>

  <!-- Main Content: Tabs -->
  <main class="main-content">
    <nav class="tabs-bar" aria-label="Views">
      <span class="tab-pill" aria-hidden="true"></span>
      <button class="tab-btn" data-tab="dashboard">Dashboard</button>
      <button class="tab-btn" data-tab="compare">Compare A/B</button>
      <button class="tab-btn" data-tab="tradeoffs">Trade-offs</button>
      <button class="tab-btn" data-tab="timeline">Timeline</button>
      <button class="tab-btn" data-tab="sensitivity">Sensitivity</button>
      <button class="tab-btn" data-tab="model">Model</button>
    </nav>

    <div class="tabs-content">
      <div class="tab-pane" data-tab="dashboard" id="tab-dashboard">
        <p class="empty">Loading simulation...</p>
      </div>
      <div class="tab-pane" data-tab="compare" id="tab-compare">
        <p class="empty">Loading comparison...</p>
      </div>
      <div class="tab-pane" data-tab="tradeoffs" id="tab-tradeoffs">
        <p class="empty">Loading trade-off map...</p>
      </div>
      <div class="tab-pane" data-tab="timeline" id="tab-timeline">
        <p class="empty">Loading charts...</p>
      </div>
      <div class="tab-pane" data-tab="sensitivity" id="tab-sensitivity">
        <p class="empty">Loading sensitivity analysis...</p>
      </div>
      <div class="tab-pane" data-tab="model" id="tab-model">
        <p class="empty">Loading model documentation...</p>
      </div>
    </div>
  </main>

</div>

<script type="module" src="app.js"></script>
</body>
</html>
